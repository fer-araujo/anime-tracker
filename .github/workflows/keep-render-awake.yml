name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${RENDER_HEALTH_URL}" ]; then
            echo "RENDER_HEALTH_URL repo variable is not set — skipping ping." >&2
            exit 1
          fi
          curl -fsS --max-time 90 "${RENDER_HEALTH_URL%/}/health"
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
